[project]
name = "aria"
version = "1.0.0"
description = "ARIA — Adaptive Room Intelligence & Automation: local-first IoT room automation backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[project.scripts]
aria = "aria.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aria"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["aria"]
# Interactive entry points: they read stdin / bind a port, so they are exercised by
# hand rather than by the suite.
omit = ["aria/__main__.py", "aria/hashpw.py"]
